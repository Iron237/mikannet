[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mikannet-mcp"
version = "0.1.0"
description = "Agent management tools for an existing Mikannet instance"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "httpx>=0.28,<1"]

[project.scripts]
mikannet-mcp = "mikannet_mcp.server:main"

[tool.setuptools.packages.find]
include = ["mikannet_mcp*"]
